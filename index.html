<header><h1>Warhammer 40.000 – Punkte-Rechner</h1><div class="sub">Smartphone-Web-App · deutsche Namen · Staffelpreise automatisch</div></header>
<main>
<div class="card">
<label>Fraktion</label><select id="f"></select>
<div class="grid" style="margin-top:9px"><div><label>Zielpunkte</label><input id="target" type="number" min="0" step="5" placeholder="z. B. 2000"></div><div><label>Aktuelle Punkte</label><div class="total" id="total">0</div></div></div>
</div>
<div class="card">
<label>Einheit</label><select id="u"></select><div id="size" style="margin-top:9px"></div>
<div class="actions"><button class="primary" id="add">+ Hinzufügen</button><button id="clear">Liste leeren</button></div>
</div>
<div class="card"><div id="list"></div><div id="empty" class="sub">Noch keine Einheiten hinzugefügt.</div></div>
<div class="card"><small><b>Staffelpreise:</b> Die App erkennt automatisch, ob eine Einheit die 1., 2. oder 3.+ Auswahl derselben Einheit ist. Wargear-Kosten sind nicht enthalten.</small><div id="status" style="margin-top:8px"></div></div>
</main>

let faction=Object.keys(D)[0], army=[];
const $=x=>document.getElementById(x);
function unit(){return D[faction].find(x=>x[0]===$("u").value)}
function price(u,occ,size){let i=u[2].findIndex(v=>v[0]===size),p=u[2][i][1];if(u[3]&&((u[3]==="2+"&&occ>=2)||(u[3]==="3+"&&occ>=3)))p=u[4][i][1];return p}
function fillF(){faction=$("f").value||faction;$("f").innerHTML="";Object.keys(D).forEach(x=>{let o=document.createElement("option");o.value=x;o.textContent=x;$("f").append(o)});$("f").value=faction}
function fillU(){let a=D[faction];$("u").innerHTML="";a.forEach(x=>{let o=document.createElement("option");o.value=x[0];o.textContent=x[1];$("u").append(o)});sizes()}
function sizes(){let u=unit(),w=$("size");w.innerHTML="";if(u[2].length>1){let l=document.createElement("label");l.textContent="Truppgröße";w.append(l);let s=document.createElement("select");s.id="s";u[2].forEach(v=>{let o=document.createElement("option");o.value=v[0];o.textContent=v[0]+" – "+v[1]+" Pkt.";s.append(o)});w.append(s)}else{let d=document.createElement("div");d.className="meta";d.textContent=u[2][0][0]+" – "+u[2][0][1]+" Punkte";w.append(d)}}
function add(){let u=unit(),size=$("s")?.value||u[2][0][0];army.push({id:u[0],size});render()}
function render(){let counts={};army.forEach(x=>counts[x.id]=(counts[x.id]||0)+1);let seen={};let total=0,html="";army.forEach((x,n)=>{seen[x.id]=(seen[x.id]||0)+1;let u=D[faction].find(y=>y[0]===x.id),p=price(u,seen[x.id],x.size);total+=p;html+=`<div class="unit"><div><div class="name">${u[1]}</div><div class="meta">${x.size}${u[3]?` · ${seen[x.id]}. Einheit`:""}</div></div><div class="pts">${p}</div><button class="del" onclick="army.splice(${n},1);render()">×</button></div>`});$("list").innerHTML=html;$("empty").style.display=army.length?"none":"block";$("total").textContent=total;let t=+$("target").value||0;$("status").innerHTML=t?`<span class="pill">${total<t?`Noch ${t-total} Punkte`:total===t?"Ziel erreicht":`${total-t} Punkte über Ziel`}</span>`:""}
